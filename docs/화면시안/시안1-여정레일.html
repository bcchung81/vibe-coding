function gallery(){const ranks=ranked().slice(0,3).map(p=>p.id),sorted=sort==='likes'?ranked():[...projects].sort((a,b)=>b.updatedAt-a.updatedAt);return `<div class="gallery-controls"><div class="segmented" role="group" aria-label="갤러리 정렬"><button data-sort="likes" aria-pressed="${sort==='likes'}">좋아요순</button><button data-sort="latest" aria-pressed="${sort==='latest'}">최신순</button></div><p class="small">사이트 9개 · 상위 3개 추천</p></div><div class="gallery">${sorted.map(p=>`<article class="project"><a href="${p.url}" target="_blank" rel="noopener noreferrer" aria-label="${p.app} 사이트 열기 · 새 탭">${shot(p)}</a><div class="project-info"><div class="project-title">${ranks.includes(p.id)?`<span class="recommend">추천 ${ranks.indexOf(p.id)+1}</span>`:''}<h3><a href="${p.url}" target="_blank" rel="noopener noreferrer">${p.app}</a></h3></div><p>${p.tagline}</p><span class="url">${p.url.replace('https://','')}</span><div class="project-bottom"><span>${p.name} · ${p.team}</span><button class="like" data-like="${p.id}" aria-pressed="${likes.has(p.id)}" aria-label="${p.app} 좋아요 ${p.likes+likes.has(p.id)}개">${heart}<b>${p.likes+likes.has(p.id)}</b></button></div></div></article>`).join('')}</div>`}
function galleryNote(){return '<p class="small" style="margin-bottom:22px">예시: 이름·앱·주소·캡처는 모두 가짜입니다. 좋아요는 예시 사용자(3팀)로 체험합니다. 사이트마다 한 번, 자기 사이트는 제외합니다.</p>'}
function home(){if(variant===1)return title('내 교육 여정','환경을 준비하고, 하나의 웹앱을 완성합니다.')+nextCard()+stages();if(variant===2)return title('이어서 시작해 볼까요?','자료는 로그인 없이, 만든 사이트는 함께 공유합니다.')+nextCard()+`<div class="overview-grid"><div>${stages()}</div><aside class="panel"><h2>내 웹앱 주제</h2><div class="summary"><p class="small">${String(selected+1).padStart(2,'0')} · ${topics[selected][1]}</p><h3 style="font-size:28px;margin:10px 0">${topics[selected][0]}</h3><p class="muted">${topics[selected][2]}</p><button class="btn" style="margin-top:22px" data-view="topics">주제와 시작 폴더 보기</button></div><div class="summary"><h3>2일차에는 이렇게</h3><p style="margin:12px 0 18px" class="muted">공통 PIN과 이름으로 로그인하고, Vercel 주소를 올리세요. 첫 화면은 자동으로 캡처합니다.</p><button class="text-btn" data-preview="project">내 프로젝트 안내</button></div></aside><section class="wide"><div class="section-head"><h2>서로의 결과물</h2><button class="text-btn" data-view="gallery">갤러리 모두 보기</button></div><p class="small" style="margin-bottom:16px">예시 · 이름·앱·주소·화면은 모두 가짜입니다.</p>${mini()}</section></div>`;if(variant===3)return title('우리가 만든 작은 쓸모','서로의 사이트를 열고, 마음에 드는 아이디어에 좋아요.',`<button class="btn" data-wall>${wallEmpty?'2일차 예시 보기':'교육 전 모습 보기'}</button>`)+`<details class="drawer"><summary>준비가 먼저라면 · 자료와 웹앱 주제 열기</summary><div class="drawer-body"><p>사전 안내부터 시작하세요. 로그인 없이 읽고 준비할 수 있습니다.</p><button class="btn primary" data-view="materials">자료 이어 읽기</button><button class="btn" data-view="topics">웹앱 주제 고르기</button></div><div style="padding:0 24px 24px">${nextCard()}${stages()}</div></details>`+(wallEmpty?`<div class="empty-wall"><h2>이 벽을 여러분의 사이트로 채웁니다.</h2><p>지금은 교육 전입니다. 먼저 사전 안내를 읽고 준비하세요.</p><button class="btn primary" data-view="materials">사전 자료 읽기</button></div>`:galleryNote()+gallery());if(variant===4)return `<div class="notebook-intro"><h1>준비부터 공유까지,<br>이 순서대로 따라오세요.</h1><p>이틀 동안 내 생활에 필요한 웹앱 하나를 만듭니다.<br>읽고, 준비하고, 고른 다음 서로에게 보여 주세요.</p></div>`+nextCard()+stages()+`<div class="summary"><h2>만들 준비가 됐다면</h2><p style="margin:16px 0">주제 10개를 읽고 하나를 고르세요. 이어서 같은 페이지에서 시작 폴더를 준비합니다.</p><button class="btn primary" data-view="topics">주제 목록으로 이어가기</button></div>`;return nextCard()+`<div class="home-board"><aside class="home-index"><h2>교육 안내</h2><p><strong>01 교육 전</strong>자료 읽기</p><p><strong>02 1일차</strong>준비하고 만들기</p><p><strong>03 2일차</strong>올리고 둘러보기</p><button class="btn" data-view="gallery">갤러리 보기</button></aside>${stages()}</div>`}
function setup(){return `<aside class="setup" id="start-folder"><div><h2>시작 폴더 준비</h2><p class="selection">고른 주제 ${String(selected+1).padStart(2,'0')} · ${topics[selected][0]}</p><p class="small">Windows PowerShell · C:\\workspace\\vibe</p></div><ol><li><p>PowerShell에 한 줄을 붙여 넣어 내려받고 풉니다.</p><div class="command"><code id="powershell">${esc(command)}</code><br><button class="btn" data-copy="powershell">명령 복사</button></div></li><li><p>그 폴더에서 에이전트를 열고 말합니다.</p><code class="inline-code">시작하기.md 대로 준비해줘</code></li><li><p>고른 주제 번호로 시작합니다.</p><code class="inline-code">/vibe-prd ${String(selected+1).padStart(2,'0')}</code></li></ol><a class="btn" href="https://kca-vibe.vercel.app/vibe.zip" download>vibe.zip 내려받기</a></aside>`}
function topicsPage(){return (variant===5?`<section class="next"><div><h2>주제를 고르고, 바로 시작하세요.</h2><p>현재 선택: ${String(selected+1).padStart(2,'0')} ${topics[selected][0]}</p></div><a class="btn" href="#start-folder">시작 폴더 안내로 →</a></section>`:'')+title('어떤 웹앱을 만들어 볼까요?','생활 속 질문 10개. 하나를 골라 공공데이터로 답을 만듭니다.')+`<div class="topic-layout"><div class="topic-list">${topics.map((t,i)=>`<article class="topic ${selected===i?'selected':''}"><div class="topic-top"><b>${String(i+1).padStart(2,'0')}</b><span>난이도 ${t[3]}</span></div><h3>${t[0]}</h3><p>${t[1]} · ${t[2]}</p><button class="btn ${selected===i?'primary':''}" data-topic="${i}" aria-pressed="${selected===i}" aria-label="${t[0]} ${selected===i?'선택됨':'주제로 고르기'}">${selected===i?'선택됨':'이 주제 고르기'}</button></article>`).join('')}</div>${setup()}</div>`}
function render(){const isGallery=view==='gallery';$('#main').innerHTML=view==='topics'?topicsPage():isGallery?(variant===5?'<section class="next"><div><h2>마음에 드는 사이트에 좋아요</h2><p>좋아요가 많은 세 사이트가 추천으로 앞에 섭니다.</p></div><button class="btn" data-preview="project">내 사이트 올리기 →</button></section>':'')+title(variant===4?'우리가 만든 웹앱 기록':'만든 사이트를 함께 봅니다.','카드를 누르면 사이트가 새 탭에서 열립니다.',variant!==5?'<button class="btn" data-preview="project">내 사이트 올리기</button>':'')+`<div class="${variant===5?'inner':''}">${galleryNote()}${gallery()}</div>`:view==='materials'?title('준비 자료','로그인 없이 읽고, 이어서 준비하세요.')+nextCard()+stages():home();$$('.nav-btn[data-view]').forEach(b=>{if(b.dataset.view===view||(b.dataset.view==='home'&&view==='materials'))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$$('[data-rail]').forEach((b,i)=>b.classList.toggle('active',i===(view==='topics'?1:view==='gallery'?2:0)));}
function navigate(v){view=v;render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}
function openPreview(type){const texts={login:['로그인','실제 서비스에서는 교육장에서 안내한 공통 PIN을 입력하고 내 이름과 팀을 고릅니다. 자료와 갤러리는 로그인 없이 볼 수 있습니다.'],project:['내 사이트 올리기','로그인한 뒤 Vercel 주소, 앱 이름, 한 줄 소개를 입력합니다. 서버가 사이트 첫 화면을 캡처해 갤러리에 보여 줍니다.'],admin:['관리','강사·조교가 관리자 비밀번호로 들어갑니다. 명단 등록, 미제출 확인, 결과 내려받기와 교육 종료 후 삭제를 관리합니다.']};const t=texts[type];$('#dialog-content').innerHTML=`<h2>${t[0]}</h2><p>${t[1]}</p><p class="small">이 HTML은 배치 비교용 시안입니다. 실제 로그인·등록·저장은 연결하지 않았습니다.</p><div class="actions"><button class="btn" data-close>닫기</button></div>`;$('#dialog').showModal()}
document.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.view){e.preventDefault();navigate(b.dataset.view)}else if(b.dataset.topic!==undefined){selected=+b.dataset.topic;persist();render();$(`[data-topic="${selected}"]`).focus({preventScroll:true});toast(topics[selected][0]+' 주제를 골랐습니다.')}else if(b.dataset.like){const id=+b.dataset.like;likes.has(id)?likes.delete(id):likes.add(id);persist();render();$(`[data-like="${id}"]`).focus({preventScroll:true});toast(likes.has(id)?'좋아요를 눌렀습니다.':'좋아요를 취소했습니다.')}else if(b.dataset.sort){sort=b.dataset.sort;render();$(`[data-sort="${sort}"]`).focus({preventScroll:true})}else if(b.hasAttribute('data-copy')){try{await navigator.clipboard.writeText(command);b.textContent='복사 완료';toast('PowerShell 명령을 복사했습니다.')}catch{const range=document.createRange();range.selectNodeContents($('#powershell'));const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);toast('명령을 선택했습니다. Ctrl+C로 복사하세요.')}}else if(b.dataset.read!==undefined){const i=+b.dataset.read,m=materials[i];if(!read.includes(i))read.push(i);persist();render();$('#dialog-content').innerHTML=`<h2>${m[0]}</h2><p>${m[1]}</p><p class="small">비교용 읽기 안내입니다. 아래 원문을 열면 전체 내용을 볼 수 있습니다. 읽음 상태는 이 브라우저에 기억합니다.</p><div class="actions"><a class="btn primary" href="${m[3]}" target="_blank" rel="noopener">원문 열기</a><button class="btn" data-close>확인</button></div>`;$('#dialog').showModal()}else if(b.dataset.download!==undefined){if(!read.includes(3))read.push(3);persist();setTimeout(render,0)}else if(b.dataset.preview){e.preventDefault();openPreview(b.dataset.preview)}else if(b.hasAttribute('data-wall')){wallEmpty=!wallEmpty;render();$('[data-wall]').focus({preventScroll:true})}else if(b.hasAttribute('data-close')){$('#dialog').close()}});
$('#dialog').addEventListener('close',()=>$('#main').focus({preventScroll:true}));render();
</script></body></html>
