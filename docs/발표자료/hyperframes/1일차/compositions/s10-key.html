  <div class="slide" id="s10-key" data-composition-id="s10-key" data-width="1920" data-height="1080">
  <header class="head"><h2>키는 내 PC의 .env.local 에만</h2><p class="meta">3교시 · 15:45–15:50</p></header>
  <div class="body">
    <ol class="steps">
      <li>공공데이터포털 마이페이지 → <b>Decoding 키</b> 복사</li>
      <li><span class="lead">별도 PowerShell 창에서 파일 열기</span>
        <div class="in tall"><span>PowerShell</span><pre>cd C:\workspace\vibe
Copy-Item .env.example .env.local
notepad .env.local</pre></div></li>
      <li><span class="lead">메모장에서 = 뒤에 붙여 넣고 저장</span>
        <div class="in"><span>.env.local</span><pre>DATA_GO_KR_KEY=붙여넣기</pre></div></li>
    </ol>
    <ul class="notes"><li>키 값은 에이전트에게 말하지 않는다 — 대화 기록에 남는다</li><li>Encoding 키 · 이름에 <code>NEXT_PUBLIC_</code> 은 쓰지 않는다</li></ul>
  </div>
  <footer class="done"><b>완료 기준</b><span>.env.local 에 키를 저장했다</span></footer>
  </div>
