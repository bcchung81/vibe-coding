  <div class="body">
    <ol class="steps">
      <li><span class="lead">배포 시키기</span>
        <div class="in"><span>에이전트에게</span><b>이 폴더를 Vercel 프로덕션으로 배포해줘. 환경변수는 내가 직접 넣을 테니 넣을 이름만 알려줘</b></div></li>

    </ol>
